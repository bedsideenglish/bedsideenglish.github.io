name: Verify landing pages

on:
  pull_request:
    paths:
      - index.html
      - about.html
      - android-everyday.html
      - learning-pages.json
      - learning/**
      - model-interview-pages.json
      - model-interviews/**
      - assets/audio/model-interviews/**
      - docs/model-history-taking-scenario-plan-ko.md
      - team-communication-pages.json
      - communication/**
      - docs/team-communication-content-system.md
      - everyday-english-pages.json
      - everyday-listening-drills.json
      - everyday-english/**
      - docs/everyday-english-content-system.md
      - assets/social/everyday-listening-og.png
      - robots.txt
      - sitemap.xml
      - tools/generate-learning-pages.py
      - tools/check-learning-pages.py
      - tools/learning_templates/**
      - tools/test_generate_learning_pages.py
      - tools/model_interview_content.py
      - tools/model_interview_templates/**
      - tools/generate-model-interview-pages.py
      - tools/generate-model-interview-audio.py
      - tools/check-model-interview-pages.py
      - tools/test_generate_model_interview_pages.py
      - tools/generate-team-communication-pages.py
      - tools/check-team-communication-pages.py
      - tools/team_communication_templates/**
      - tools/test_generate_team_communication_pages.py
      - tools/generate-everyday-english-pages.py
      - tools/check-everyday-english-pages.py
      - tools/everyday_english_templates/**
      - tools/test_generate_everyday_english_pages.py
      - tools/site_map.py
      - .github/workflows/verify-landing-pages.yml
  push:
    branches:
      - main
    paths:
      - index.html
      - about.html
      - android-everyday.html
      - learning-pages.json
      - learning/**
      - model-interview-pages.json
      - model-interviews/**
      - assets/audio/model-interviews/**
      - docs/model-history-taking-scenario-plan-ko.md
      - team-communication-pages.json
      - communication/**
      - docs/team-communication-content-system.md
      - everyday-english-pages.json
      - everyday-listening-drills.json
      - everyday-english/**
      - docs/everyday-english-content-system.md
      - assets/social/everyday-listening-og.png
      - robots.txt
      - sitemap.xml
      - tools/generate-learning-pages.py
      - tools/check-learning-pages.py
      - tools/learning_templates/**
      - tools/test_generate_learning_pages.py
      - tools/model_interview_content.py
      - tools/model_interview_templates/**
      - tools/generate-model-interview-pages.py
      - tools/generate-model-interview-audio.py
      - tools/check-model-interview-pages.py
      - tools/test_generate_model_interview_pages.py
      - tools/generate-team-communication-pages.py
      - tools/check-team-communication-pages.py
      - tools/team_communication_templates/**
      - tools/test_generate_team_communication_pages.py
      - tools/generate-everyday-english-pages.py
      - tools/check-everyday-english-pages.py
      - tools/everyday_english_templates/**
      - tools/test_generate_everyday_english_pages.py
      - tools/site_map.py
      - .github/workflows/verify-landing-pages.yml

permissions:
  contents: read

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python tools/test_generate_learning_pages.py
      - run: python tools/generate-learning-pages.py --check
      - run: python tools/check-learning-pages.py
      - run: python tools/test_generate_model_interview_pages.py
      - run: python tools/generate-model-interview-pages.py --check
      - run: python tools/check-model-interview-pages.py
      - run: python tools/test_generate_team_communication_pages.py
      - run: python tools/generate-team-communication-pages.py --check
      - run: python tools/check-team-communication-pages.py
      - run: python tools/test_generate_everyday_english_pages.py
      - run: python tools/generate-everyday-english-pages.py --check
      - run: python tools/check-everyday-english-pages.py
