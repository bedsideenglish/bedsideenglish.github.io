name: Verify landing pages

on:
  pull_request:
    paths:
      - index.html
      - android.html
      - android-everyday.html
      - learning-pages.json
      - learning/**
      - sitemap.xml
      - tools/generate-learning-pages.py
      - tools/check-learning-pages.py
      - tools/learning_templates/**
      - tools/test_generate_learning_pages.py
      - tools/sync-landing-pages.py
      - .github/workflows/verify-landing-pages.yml
  push:
    branches:
      - main
    paths:
      - index.html
      - android.html
      - android-everyday.html
      - learning-pages.json
      - learning/**
      - sitemap.xml
      - tools/generate-learning-pages.py
      - tools/check-learning-pages.py
      - tools/learning_templates/**
      - tools/test_generate_learning_pages.py
      - tools/sync-landing-pages.py
      - .github/workflows/verify-landing-pages.yml

permissions:
  contents: read

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/sync-landing-pages.py
      - run: python tools/test_generate_learning_pages.py
      - run: python tools/generate-learning-pages.py --check
      - run: python tools/check-learning-pages.py
