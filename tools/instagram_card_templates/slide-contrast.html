<section class="half said">
<div class="step">
<span class="code">{{CODE}}</span>
<span class="name">{{NAME}}</span>
<span class="pager">{{PAGER}}</span>
</div>
<div class="quote-wrap">
<div class="line bad"><span class="mark">&#10007;</span><q>{{BAD}}</q></div>
</div>
</section>
<section class="half instead">
<div class="quote-wrap">
<div class="line good"><span class="mark">&#10003;</span><q>{{GOOD}}</q></div>
</div>
<p class="reason">{{REASON}}</p>
</section>
