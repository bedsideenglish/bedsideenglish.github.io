<section class="half said">
<div class="step">
<span class="code">{{BADGE}}</span>
<span class="name">{{NAME}}</span>
<span class="pager">{{PAGER}}</span>
</div>
<div class="quote-wrap">
<div class="line top"><span class="mark">{{TOP_LABEL}}</span><q>{{TOP_TEXT}}</q></div>
</div>
</section>
<section class="half instead">
<div class="quote-wrap">
<div class="line bottom"><span class="mark">{{BOTTOM_LABEL}}</span><q>{{BOTTOM_TEXT}}</q></div>
</div>
<p class="reason">{{REASON}}</p>
</section>
